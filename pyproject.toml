[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalping_test"
version = "0.1.0"
description = "Polymarket-vs-Binance latency arb bot (paper-trade default)"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.17.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[project.scripts]
scalp = "src.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
